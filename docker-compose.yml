version: '3.8'

services:
  # PostgreSQL Database Container
  postgres:
    image: postgres:15-alpine
    container_name: resume_analyzer_db
    restart: always
    environment:
      POSTGRES_DB: resume_analyzer_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resume_analyzer_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend API Container
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: resume_analyzer_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/resume_analyzer_db
      SECRET_KEY: super-secret-production-jwt-key-resume-analyzer-2026
      ACCESS_TOKEN_EXPIRE_MINUTES: 10080
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_SIZE_MB: 15
    ports:
      - "8000:8000"
    volumes:
      - resume_uploads:/app/uploads

  # React Frontend SaaS UI Container
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: resume_analyzer_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
  resume_uploads:
